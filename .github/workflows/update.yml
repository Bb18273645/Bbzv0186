name: 澧為噺鏇存柊

on:
  workflow_dispatch:
    inputs:
      from_setup:
        description: '鏄惁鐢遍娆″缓妗ｉ摼寮忚Е鍙戯紙true 鏃惰窇瀹屼細瑙﹀彂鍏ㄩ噺閲嶈瘯锛?
        required: false
        default: 'false'
      only_index:
        description: '浠呴噸寤虹储寮曪紙true 鏃惰烦杩囨墍鏈夋姄鍙栵紝鍙窇 build-index锛岀敤浜庢敼瀹岀疆椤?璧勬枡鍚庡揩閫熺敓鏁堬級'
        required: false
        default: 'false'

jobs:
  update-html-image:
    name: 澧為噺 HTML+鍥剧墖
    if: github.event.inputs.only_index != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TWITTER_PROXY_BASE: ${{ secrets.TWITTER_PROXY_BASE }}
    permissions:
      contents: write

    steps:
      - name: 妫€鍑轰粨搴?        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 璇诲彇璐﹀彿鍒楄〃
        id: info
        run: |
          # 鎵弿 accounts/ 鐩綍锛屽彇鎵€鏈夊惈 wayback_snapshots 鐨勫瓙鐩綍 = 鐪熷疄璐﹀彿鍒楄〃
          # 鏀寔鍗曡处鍙?/ 澶氳处鍙?/ 浠撳簱鍚嶁墵璐﹀彿鍚嶏紱涓嶄緷璧?accounts.txt
          ACCOUNTS=$(ls -1 accounts 2>/dev/null | while IFS= read -r name; do
            [ -d "accounts/${name}/wayback_snapshots" ] && echo "$name"
          done)
          # 鍏滃簳锛氭壂涓嶅埌锛堥娆″缓妗ｅ墠锛夊垯鐢ㄤ粨搴撳悕
          if [ -z "$ACCOUNTS" ]; then
            ACCOUNTS=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          fi
          echo "accounts<<EOF" >> $GITHUB_OUTPUT
          echo "$ACCOUNTS"     >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

      - name: 妫€鏌ユ暟鎹洰褰?        id: check
        run: |
          SKIP=true
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ -d "accounts/${U}/wayback_snapshots" ]; then
              SKIP=false
              break
            fi
          done <<< "${{ steps.info.outputs.accounts }}"
          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          if [ "$SKIP" = "true" ]; then echo "鈿狅笍 璇峰厛杩愯棣栨寤烘。"; fi

      - name: 瀹夎渚濊禆
        if: steps.check.outputs.skip == 'false'
        run: pip install requests beautifulsoup4 lxml

      - name: 鎷夊彇鏈€鏂?archive.py 鍜屽墠绔枃浠?        if: steps.check.outputs.skip == 'false'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/sjshb57/Test/main/archive.py" \
            -o /tmp/archive.py
          curl -fsSL "https://raw.githubusercontent.com/sjshb57/Test/main/index.html" \
            -o index.html || true
          ACCOUNTS="${{ steps.info.outputs.accounts }}"
          ACCOUNTS_JSON=$(echo "$ACCOUNTS" | awk '{printf "'\''%s'\'', ", $0}' | sed "s/, $//")
          sed -i "s/const ACCOUNTS_HARDCODED = \[.*\]/const ACCOUNTS_HARDCODED = [${ACCOUNTS_JSON}]/" index.html || true
          echo "鉁?archive.py ($(wc -l < /tmp/archive.py) 琛?"

      - name: fetch-cdx
        if: steps.check.outputs.skip == 'false'
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py fetch-cdx "$U" || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: fetch-html
        if: steps.check.outputs.skip == 'false'
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py fetch-html || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: fetch-image
        if: steps.check.outputs.skip == 'false'
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py fetch-image || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: retry --image-failed
        if: steps.check.outputs.skip == 'false'
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py retry --image-failed || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: clean-html --force
        if: steps.check.outputs.skip == 'false'
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py clean-html --force || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: 鎺ㄩ€?        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only | while IFS= read -r f; do
            if [ ! -f "$f" ]; then continue; fi
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 104857600 ]; then git rm --cached "$f"; fi
          done
          git diff --cached --quiet && echo "鏃犳柊鍐呭" && exit 0
          COUNT=$(git diff --cached --name-only | grep -v -e "/_log/" -e "/archive_index\.json$" -e "/index\.json$" -e "/media_index\.json$" | wc -l)
          [ "$COUNT" -eq 0 ] && COUNT=$(git diff --cached --numstat | wc -l)
          git commit -m "馃攧 澧為噺 HTML+鍥剧墖 (+${COUNT} 鏂囦欢) $(date -u +%Y-%m-%d) [skip ci]"
          git push

  update-video:
    name: 澧為噺 瑙嗛
    if: github.event.inputs.only_index != 'true'
    needs: update-html-image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TWITTER_PROXY_BASE: ${{ secrets.TWITTER_PROXY_BASE }}
    permissions:
      contents: write

    steps:
      - name: 妫€鍑轰粨搴擄紙鎷夋渶鏂帮級
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: 璇诲彇璐﹀彿鍒楄〃
        id: info
        run: |
          # 鎵弿 accounts/ 鐩綍锛屽彇鎵€鏈夊惈 wayback_snapshots 鐨勫瓙鐩綍 = 鐪熷疄璐﹀彿鍒楄〃
          # 鏀寔鍗曡处鍙?/ 澶氳处鍙?/ 浠撳簱鍚嶁墵璐﹀彿鍚嶏紱涓嶄緷璧?accounts.txt
          ACCOUNTS=$(ls -1 accounts 2>/dev/null | while IFS= read -r name; do
            [ -d "accounts/${name}/wayback_snapshots" ] && echo "$name"
          done)
          # 鍏滃簳锛氭壂涓嶅埌锛堥娆″缓妗ｅ墠锛夊垯鐢ㄤ粨搴撳悕
          if [ -z "$ACCOUNTS" ]; then
            ACCOUNTS=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          fi
          echo "accounts<<EOF" >> $GITHUB_OUTPUT
          echo "$ACCOUNTS"     >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

      - name: 瀹夎渚濊禆
        run: pip install requests beautifulsoup4 lxml

      - name: 鎷夊彇鏈€鏂?archive.py
        run: curl -fsSL "https://raw.githubusercontent.com/sjshb57/Test/main/archive.py" -o /tmp/archive.py

      - name: fetch-video
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py fetch-video || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: retry --video-failed
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py retry --video-failed || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: clean-html --force
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py clean-html --force || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: 鎺ㄩ€?        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only | while IFS= read -r f; do
            if [ ! -f "$f" ]; then continue; fi
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 104857600 ]; then git rm --cached "$f"; fi
          done
          git diff --cached --quiet && echo "鏃犳柊鍐呭" && exit 0
          COUNT=$(git diff --cached --name-only | grep -v -e "/_log/" -e "/archive_index\.json$" -e "/index\.json$" -e "/media_index\.json$" | wc -l)
          [ "$COUNT" -eq 0 ] && COUNT=$(git diff --cached --numstat | wc -l)
          git commit -m "馃幀 澧為噺 瑙嗛 (+${COUNT} 鏂囦欢) $(date -u +%Y-%m-%d) [skip ci]"
          git push

  update-avatar:
    name: 澧為噺 澶村儚+鏀跺熬
    needs: update-video
    if: always() && (github.event.inputs.only_index == 'true' || needs.update-video.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TWITTER_PROXY_BASE: ${{ secrets.TWITTER_PROXY_BASE }}
    permissions:
      contents: write

    steps:
      - name: 妫€鍑轰粨搴擄紙鎷夋渶鏂帮級
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: 璇诲彇璐﹀彿鍒楄〃
        id: info
        run: |
          # 鎵弿 accounts/ 鐩綍锛屽彇鎵€鏈夊惈 wayback_snapshots 鐨勫瓙鐩綍 = 鐪熷疄璐﹀彿鍒楄〃
          # 鏀寔鍗曡处鍙?/ 澶氳处鍙?/ 浠撳簱鍚嶁墵璐﹀彿鍚嶏紱涓嶄緷璧?accounts.txt
          ACCOUNTS=$(ls -1 accounts 2>/dev/null | while IFS= read -r name; do
            [ -d "accounts/${name}/wayback_snapshots" ] && echo "$name"
          done)
          # 鍏滃簳锛氭壂涓嶅埌锛堥娆″缓妗ｅ墠锛夊垯鐢ㄤ粨搴撳悕
          if [ -z "$ACCOUNTS" ]; then
            ACCOUNTS=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          fi
          echo "accounts<<EOF" >> $GITHUB_OUTPUT
          echo "$ACCOUNTS"     >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

      - name: 瀹夎渚濊禆
        run: pip install requests beautifulsoup4 lxml

      - name: 鎷夊彇鏈€鏂?archive.py
        run: curl -fsSL "https://raw.githubusercontent.com/sjshb57/Test/main/archive.py" -o /tmp/archive.py

      - name: fetch-avatars
        if: github.event.inputs.only_index != 'true'
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py fetch-avatars || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: retry --avatar-failed
        if: github.event.inputs.only_index != 'true'
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py retry --avatar-failed || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: clean-html --force
        if: github.event.inputs.only_index != 'true'
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py clean-html --force || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: build-index
        run: |
          while IFS= read -r U; do
            if [ -z "$U" ]; then continue; fi
            if [ ! -d "accounts/${U}/wayback_snapshots" ]; then continue; fi
            cd accounts/${U} && python3 /tmp/archive.py build-index || true
            cd ../..
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: 鎺ㄩ€?        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only | while IFS= read -r f; do
            if [ ! -f "$f" ]; then continue; fi
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 104857600 ]; then git rm --cached "$f"; fi
          done
          if git diff --cached --quiet; then echo "鉁?鏈懆鏃犳柊鍐呭"; exit 0; fi
          COUNT=$(git diff --cached --name-only | grep -v -e "/_log/" -e "/archive_index\.json$" -e "/index\.json$" -e "/media_index\.json$" | wc -l)
          [ "$COUNT" -eq 0 ] && COUNT=$(git diff --cached --numstat | wc -l)
          git commit -m "鉁?澧為噺瀹屾垚 (+${COUNT} 鏂囦欢) $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: 閾惧紡瑙﹀彂鍏ㄩ噺閲嶈瘯锛堜粎棣栨寤烘。閾捐矾锛岀敱 setup 瑙﹀彂鏃讹級
        if: ${{ github.event.inputs.from_setup == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "${{ secrets.DISPATCH_TOKEN }}" ]; then
            echo "::warning::鏈厤缃?DISPATCH_TOKEN,鏃犳硶鑷姩瑙﹀彂 retry_all.yml"
            exit 0
          fi
          sleep 5
          gh workflow run retry_all.yml --repo "${{ github.repository }}" \
            && echo "鉁?宸茶Е鍙戝叏閲忛噸璇? \
            || echo "::warning::瑙﹀彂 retry_all.yml 澶辫触"
